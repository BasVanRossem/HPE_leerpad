<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Oefening</title>
  <link rel="stylesheet" href="style.css">

  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      chtml: { scale: 1 }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body class="palette-blue">

<div id="layout">
  <div id="left-col">
    <div id="opgave">
      <b>Opgave:</b><br>
      Lien staat op een balkon 38.6m boven de grond. Pedro bevindt zich wat verder op de
      grond. Vanop het balkon gooit Lien een bal naar Pedro. De bal vertrekt 1.4m boven het
      balkon en met een hoek van 37° onder de horizontale. Pedro vangt de bal 2.0 seconden
      later.
    </div>
    <div id="opgaveImageWrap">
      <div class="figure-nav">
        <button id="figurePrev">⭠</button>
        <span id="figureCounter">Figuur 1 van 1</span>
        <button id="figureNext">⭢</button>
      </div>
      <div class="figure-frame">
        <img id="opgaveImage" src="" alt="Figuur">
        <button type="button" id="opgaveImageZoom" class="figure-zoom-btn" aria-label="Vergroot figuur" title="Vergroot figuur">+</button>
      </div>
    </div>
  </div>
  <div id="quiz"></div>
</div>

<script id="quiz-data" type="application/json">
{
  "successMessages": [
    "Goed bezig!",
    "Blijf zo doorgaan!",
    "Helemaal juist!"
  ],
  "orientation": [
    {
      "type": "info",
      "text": "Bekijk onderstaande video ter introductie van het vraagstuk.",
      "video": "reeks_1B_oefening_7.mp4"
    },

      "type": "photo",
      "text": "Hoe ziet de vectorontbinding van de beginsituatie eruit?",

        {
          "src": "1BO5 foto 4.jpg",
          "correct": true
        },
        {
          "src": "1BO5 foto 1.jpg",
          "correct": false,
          "feedback": "Probeer opnieuw! Alpha is de hoek met de horizontale, niet de verticale!"
        },

          "src": "1BO5 foto 2.jpg",
          "correct": false,
          "feedback": "Probeer opnieuw! Alpha is de hoek onder de verticale, niet erboven!"
        },
        {
          "src": "1BO5 foto 3.jpg",
          "correct": false,
          "feedback": "Probeer opnieuw! Alpha is de hoek met de horizontale, niet de verticale. Ook is het de hoek onder de verticale, niet erboven."
        }
      ]
    }
  ],
  "questions": [
    {
      "type": "input",
      "text": "Hoe ver van de muur van het gebouw staat Pedro?",
      "answer": 27.1,
      "prefix": "$d =$",
      "unit": "m",

        {
          "type": "info",
          "label": "Bekijk de video.",
          "text": "Bekijk onderstaande video om je op weg te helpen met deelvraag 1.",
          "video": "reeks_1B_oefening_7.mp4"
        },
        {
          "type": "input",
          "label": "Bepaal $v_{0y}$.",
          "answer": -10.2,
          "prefix": "$v_{0y}$",
          "unit": "m/s",
          "wrongAnswers": {
            "10.2": "Let op het teken! De snelheid is naar beneden gericht!"
          }
        },
        {
          "type": "input",
          "label": "Bepaal $v_{0}$.",
          "answer": 16.9,
          "prefix": "$v_0$",
          "unit": "m/s",

          }
        }
      ]
    },
    {
      "type": "input",
      "text": "Onder welke hoek (met de horizontale) $\\beta$ bewoog de bal op het ogenblik dat Pedro de bal vangt? (Let op je teken!)",

      "unit": "graden",
      "wrongAnswers": {

        "65.6": "Let op je teken! Onder de horizontale -> negatief!"
      },
      "hints": [
        {
          "type": "info",
          "label": "Bekijk de video.",
          "text": "Bekijk onderstaande video om je op weg te helpen met deelvraag 2.",
          "video": "reeks_1B_oefening_7.mp4"

        {
          "type": "input",

          "answer": -29.8,

          "unit": "m/s",

      ],

    },
    {

    }
  ],
  "problemImage": {
    "src": "1BO5 foto 6.jpg",
    "alwaysShow": false

}
</script>

<script src="engine.js" defer></script>

</html>
